build_image_job:
  stage: build
  tags:
    - digiheals

  before_script:
    - echo "Setting up Docker BuildKit..."
    - mkdir -p $DOCKER_CONFIG/cli-plugins

  script:
    # Log into registry
    - echo "$CI_REGISTRY_PASSWORD" | docker login registry-tigr.narfs.co -u "$CI_REGISTRY_USER" --password-stdin

    # Tag and build Docker image
    - export IMAGE_TAG=registry-tigr.narfs.co/digiheals/docker:${CI_COMMIT_REF_SLUG}
    - docker build -t $IMAGE_TAG .
    
    # Push image to registry
    - docker push $IMAGE_TAG

    # Tag as 'latest' if on staging branch
    - |
      if [ "$CI_COMMIT_REF_NAME" == "staging" ]; then
        docker tag $IMAGE_TAG registry-tigr.narfs.co/digiheals/docker:latest
        docker push registry-tigr.narfs.co/digiheals/docker:latest
      fi


build_job:
  stage: build

  tags:
    - digiheals

  script:
    - docker pull registry-tigr.narfs.co/digiheals/docker:${CI_COMMIT_REF_SLUG} || docker pull registry-tigr.narfs.co/digiheals/docker:latest
    
    - docker compose up -d

    - sleep 480  # Wait for services to initialize

test_job:
  stage: test

  tags:
    - digiheals

  script:
    # Run tests
    - make test

  after_script:
    # Tear down containers
    - docker compose down -v
