stages:
  - test

services:
  - docker:dind  

image: docker:latest 

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""    # Disabled TLS for DinD
  COMPOSE_PROFILES: neo4jTest
  OPENAI_API_KEY: ""
  ORGANIZATION_KEY: ""
  PROJECT_KEY: ""
  DOCKER_CONFIG: ${DOCKER_CONFIG:-$HOME/.docker}

test_job:
  stage: test

  tags:
    - digiheals

  before_script:
    # Install Python and dependencies
    - apk add --no-cache python3 py3-pip curl 
    - python3 -m venv /builds/venv
    - . /builds/venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt

    # Download and extract Neo4j test data
    - curl -L -o neo4jTest.tar.xz "https://drive.google.com/uc?export=download&id=1JXXPCnuPyerGKTPNVWYWF8Aw-mdHDFH_"
    - ls -lh neo4jTest.tar.xz
    - mkdir -p neo4jTest
    - tar -xJf neo4jTest.tar.xz -C neo4jTest/ || echo "Warning: tar extraction failed"

    # Install specific Docker Compose version
    - mkdir -p $DOCKER_CONFIG/cli-plugins
    - curl -SL https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-$(uname -m) -o $DOCKER_CONFIG/cli-plugins/docker-compose
    - chmod +x $DOCKER_CONFIG/cli-plugins/docker-compose
    - docker compose version

  script:
    # Build and start services
    - docker compose build --no-cache
    - docker compose up -d
    - sleep 300  # Wait for services to initialize

    # Run tests
    - make test

  after_script:
    # Tear down containers
    - docker compose down -v
