stages:
  - linting
  - build
  - test

services:
  - docker:dind  

image: docker:latest 

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""    # Disabled TLS for DinD
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1
  COMPOSE_PROFILES: neo4jTest
  OPENAI_API_KEY: ""
  ORGANIZATION_KEY: ""
  PROJECT_KEY: ""
  DOCKER_CONFIG: ${DOCKER_CONFIG:-$HOME/.docker}

black:
  stage: linting
  tags:
    - digiheals
  image: registry.gitlab.com/pipeline-components/black:latest
  script:
    - black --check .

